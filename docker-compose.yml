# =============================================================================
# Jart-OS — Root docker-compose.yml
# Each app is autocontained in its tier folder. No shared services.
# =============================================================================

name: jart-os

include:
  # TIER-03 — SERVICES
  - TIERS/TIER-03-SERVICES/10301-msg-redis/docker-compose.yml
  - TIERS/TIER-03-SERVICES/10302-msg-nats/docker-compose.yml

  # TIER-02 — GATEWAY
  - TIERS/TIER-02-GATEWAY/10201-proxy-litellm/docker-compose.yml

  # TIER-04 — AGENTS
  - TIERS/TIER-04-AGENTS/10401-agent-director/docker-compose.yml
  - TIERS/TIER-04-AGENTS/10402-agent-executor/docker-compose.yml
  - TIERS/TIER-04-AGENTS/10403-agent-guardian/docker-compose.yml
  - TIERS/TIER-04-AGENTS/10404-agent-council/docker-compose.yml

  # STUDY DOMAIN
  - study/docker-compose.yml

  # TIER-06 — PROCESSES
  - TIERS/TIER-06-PROCESSES/10601-pipe-pdf/docker-compose.yml
  - TIERS/TIER-06-PROCESSES/10602-pipe-photos/docker-compose.yml
  - TIERS/TIER-06-PROCESSES/10603-pipe-video/docker-compose.yml
  - TIERS/TIER-06-PROCESSES/10604-pipe-rag/docker-compose.yml

  # TIER-07 — INTERFACES
  - TIERS/TIER-07-INTERFACES/10701-web-mission_control/docker-compose.yml
  - TIERS/TIER-07-INTERFACES/10702-web-grafana/docker-compose.yml

  # TIER-09 — CONTROL
  - TIERS/TIER-09-CONTROL/10901-metrics-prometheus/docker-compose.yml

networks:
  jart-os-net:
    name: jart-os-net
    driver: bridge
