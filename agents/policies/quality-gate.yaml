# Jart-OS Quality Gate — Post-execution validation
# Spec reference: §14 "Policy Gates & Governance > Layer B: Quality Gate (Post-execution)"
#
# Guardian validates executor output against these thresholds.
# On fail: retry with feedback (max 3). Escalation to council after max retries.
# Location: agents/policies/quality-gate.yaml — §14

version: "1.0.0"
name: "Jart-OS Quality Gate"
description: >
  Post-execution quality validation. Guardian checks completeness,
  accuracy, and format of executor output. Failed tasks are retried
  with feedback up to max_retries, then escalated to council.
  — §14 Layer B

thresholds:
  - id: "quality-001"
    name: "completeness"
    description: >
      Output must address all success_criteria items. — §14 Layer B
      'completeness ≥ 0.8'
    metric: "completeness"
    minimum: 0.8
    weight: 0.4
    error_message: "Output does not address all required criteria (completeness < 0.8)"

  - id: "quality-002"
    name: "accuracy"
    description: >
      Output must be factually correct. — §14 Layer B 'accuracy ≥ 0.9'
    metric: "accuracy"
    minimum: 0.9
    weight: 0.4
    error_message: "Output contains factual errors (accuracy < 0.9)"

  - id: "quality-003"
    name: "format"
    description: >
      Output must follow required format exactly. — §14 Layer B 'format = 1.0'
    metric: "format"
    minimum: 1.0
    weight: 0.2
    error_message: "Output does not match required format (format < 1.0)"

retry_policy:
  max_retries: 3  # §14 Layer B 'max 3'
  retry_with_feedback: true  # §14 Layer B 'retry with feedback'
  backoff_seconds: [5, 15, 30]  # Exponential backoff between retries
  feedback_template: >
    Previous output failed quality gate. Issues:
    {failure_reasons}
    
    Original objective: {objective}
    Success criteria: {success_criteria}
    
    Please address the failures and retry.

escalation:
  target: "council"  # §14 Layer B 'Escalation to council'
  trigger: "max_retries_exceeded"
  action: >
    When all retries are exhausted, the task is forwarded to
    jart-os.04.study.council.proposals for council review.
    — §14 'Escalation to council after max retries'

verdict_format:
  pass: "PASS"
  fail: "FAIL"
  required_fields:
    - "verdict"
    - "reason"
    - "completeness"
    - "accuracy"
    - "format"
