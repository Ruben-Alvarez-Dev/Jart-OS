services:
  redis:
    image: redis:7-alpine
    container_name: jart-os-redis
    ports: ["10301:6379"]
    volumes:
      - ./data:/data
    command: redis-server --appendonly yes --notify-keyspace-events AKE
    restart: unless-stopped
    networks: [jart-os-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
