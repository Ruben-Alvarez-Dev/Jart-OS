id: ESP-ACA-DIR-001-director_study
role: director
domain: study
tier: 4
model: glm-5
temperature: 0.7
port: 10411

description: "Plans and decomposes tasks for the study domain. Receives user requests, generates specs, delegates to Executor and Guardian."

responsibilities:
  - receive_user_request
  - decompose_into_subtasks
  - create_spec_per_subtask
  - delegate_to_executor
  - monitor_progress
  - assemble_final_result

nats_subjects:
  listen: "jart-os.04.study.director.command"
  events: "jart-os.04.study.director.events"
  errors: "jart-os.04.study.director.errors"

dependencies:
  executor: "jart-os.04.study.executor.command"
  guardian: "jart-os.04.study.guardian.checks"
  council: "jart-os.04.study.council.proposals"
