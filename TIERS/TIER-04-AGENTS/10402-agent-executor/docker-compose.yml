# Jart-OS Executor Agent — Study Domain
# Spec: §5, §6 port 10402, §8 "jart-os-executor-study"
#       §10 "Executor: glm-4.7, temp 0.3", §11 "Tri-Unit"

services:
  executor:
    build:
      context: ../../..
      dockerfile: agents/Dockerfile.agent
    container_name: jart-os-executor-study
    environment:
      - AGENT_ROLE=executor
      - AGENT_PORT=10402
      - EXECUTOR_MODEL=${EXECUTOR_MODEL:-glm-4.7}
      - NATS_URL=nats://token:${NATS_TOKEN:-REDACTED_NATS_TOKEN}@nats:4222
      - REDIS_URL=redis://:${REDIS_PASSWORD:-REDACTED_REDIS_PASSWORD}@redis:6379
      - LITELLM_URL=http://litellm:4000
      - LITELLM_KEY=${LITELLM_KEY:-REDACTED_LITELLM_MASTER_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:10402:10402"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks: [jart-os-net]

networks:
  jart-os-net:
    external: true
