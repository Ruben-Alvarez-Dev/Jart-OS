id: ESP-ACA-ARC-001-guardian
role: guardian
domain: study
tier: 4
model: phi3-local
temperature: 0.1
port: 10413

description: "Valida outputs contra policy gates (spec-gate + quality-gate). Emite veredictos PASS/FAIL. Escala al Council si max retries agotado."

responsibilities:
  - validate_spec_pre_execution
  - validate_output_post_execution
  - enforce_quality_thresholds
  - issue_pass_fail_verdicts
  - escalate_to_council

nats_subjects:
  listen: "jart-os.04.study.guardian.checks"
  events: "jart-os.04.study.guardian.verdicts"
  errors: "jart-os.04.study.guardian.errors"
  escalation: "jart-os.04.study.council.escalation"
