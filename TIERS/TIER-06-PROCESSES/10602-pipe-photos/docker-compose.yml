# Jart-OS Photos Pipeline
# Spec: §5 autocontained, §6 port 10602, §8 "jart-os-pipe-photos"

services:
  photos:
    build:
      context: ../../..
      dockerfile: TIERS/TIER-06-PROCESSES/10602-pipe-photos/Dockerfile
    container_name: jart-os-pipe-photos
    ports:
      - "10602:10602"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks: [jart-os-net]

networks:
  jart-os-net:
    external: true
