# Jart-OS Mission Control — Builderz Prebuilt
# Spec: D10 (MC prebuilt), D11 (nuke old MC)

services:
  mission-control:
    image: ghcr.io/builderz-labs/mission-control:latest
    container_name: jart-os-mc
    ports:
      - "127.0.0.1:10701:3000"
    volumes:
      - mc-data:/app/.data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PORT=3000
      # ── Auth ──
      - AUTH_USER=${MC_AUTH_USER:?MC_AUTH_USER env var is required}
      - AUTH_PASS=${MC_AUTH_PASS:?MC_AUTH_PASS env var is required}
      - MC_COOKIE_SECURE=false
      - MC_COOKIE_SAMESITE=lax
      - MC_ALLOWED_HOSTS=localhost,127.0.0.1,::1,jart-os.local
      # ── Gateway (sin OpenClaw por ahora — standalone mode) ──
      - NEXT_PUBLIC_GATEWAY_OPTIONAL=true
      # ── OpenClaw paths ──
      - OPENCLAW_TOOLS_PROFILE=coding
      - MC_DEFAULT_GATEWAY_NAME=jart-os
      - MC_COORDINATOR_AGENT=director
      - NEXT_PUBLIC_COORDINATOR_AGENT=director
      # ── Data retention ──
      - MC_RETAIN_ACTIVITIES_DAYS=90
      - MC_RETAIN_LOGS_DAYS=30
      - MC_RETAIN_TOKEN_USAGE_DAYS=90
    restart: unless-stopped
    networks: [jart-os-net]

volumes:
  mc-data:

networks:
  jart-os-net:
    external: true
