services:
  mission-control:
    build:
      context: ../../..
      dockerfile: TIERS/TIER-07-INTERFACES/10701-web-mission_control/Dockerfile.mission_control
    container_name: jart-os-mc
    ports: ["10701:80"]
    volumes:
      - ./config:/app/config
      - $JART_OS_HOME/study:/app/study:ro
    environment:
      - API_PORT=80
      - NATS_URL=nats://token:${NATS_TOKEN:-REDACTED_NATS_TOKEN}@nats:4222
      - REDIS_URL=redis://:${REDIS_PASSWORD:-REDACTED_REDIS_PASSWORD}@redis:6379
    restart: unless-stopped
    networks: [jart-os-net]
